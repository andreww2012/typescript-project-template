# @if changesets
name: Check code (+ Publish)
# @endif
# @if !changesets
name: Check code
# @endif
on:
  pull_request:
  push:
    branches:
      - main

# @if changesets
permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for Trusted Publishing
# @endif
# @if !changesets
permissions:
  contents: read
# @endif

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
  # @if knip

  knip:
    name: Knip
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm knip
  # @endif
  # @if cspell

  spellcheck:
    name: Spellcheck (cspell)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm check:spelling
  # @endif

  formatting:
    # @if oxfmt
    name: Formatting check (oxfmt)
    # @endif
    # @if prettier
    name: Formatting check (Prettier)
    # @endif
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm check:format

  typecheck:
    name: Typecheck (tsgo)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm ts

  eslint:
    name: ESLint
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm eslint
  # @if lychee

  check-links:
    name: Check links
    needs: install
    uses: ./.github/workflows/check-links.yml
  # @endif
  # @if vitest

  test:
    name: Test (Node ${{ matrix.node-version }})
    needs: install
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm test:vitest
  # @endif
  # @if lib

  build:
    # @if publint
    name: Build (tsdown) & lint package (attw, publint)
    # @endif
    # @if !publint
    name: Build (tsdown) & lint package (attw)
    # @endif
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm check:package
  # @endif
  # @if changesets

  release-main:
    name: Create release PR _OR_ Publish on merge
    needs:
      # @if knip
      - knip
      # @endif
      # @if cspell
      - spellcheck
      # @endif
      - formatting
      - typecheck
      - eslint
      # @if lychee
      - check-links
      # @endif
      # @if vitest
      - test
      # @endif
      - build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare
      # Based on https://github.com/changesets/action/issues/303#issuecomment-1888167265
      - name: Capture new release version
        env:
          # For the changelog generator, the action passes it on its own
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Exits with 1 if there are no unreleased changesets,
          # in which case the version stays the same
          pnpm changeset version || true
          echo "NEW_VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV
          git restore .
          # `changeset version` may also create new files (like `CHANGELOG.md` on the first release)
          git clean -fdq
      - name: Create release / Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm release
          pr-title: 'chore: release v${{ env.NEW_VERSION }}'
          commit-message: 'chore: release v${{ env.NEW_VERSION }}'
  # @endif
