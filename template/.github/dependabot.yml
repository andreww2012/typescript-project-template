version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Like `minimumReleaseAge` in `pnpm-workspace.yaml`, but Dependabot only counts in days
    cooldown:
      default-days: 1
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      # Its major version must match the lowest supported Node.js version
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  # @if ci
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  # @endif
