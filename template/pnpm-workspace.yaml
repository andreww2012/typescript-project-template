# @if workspace
packages:
  - ./

# @endif
# @if catalogs
catalogPrune: true
catalogs: {}

# @endif
# shamefullyHoist: true
# @if save-exact
saveExact: true
# @endif
# @if pnpm12
autoDedupe: true
saveTypes: true
lockfile:
  # Records `autoDedupe`, so that installs don't resolve the lockfile again
  includeResolutionSettings: true
# @endif

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeExclude: []
minimumReleaseAgeExcludePrune: true
# @if release-age-fallback
minimumReleaseAgeStrict: false
# @endif

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
# @if !lefthook
trustPolicyExclude: []
# @endif
# @if lefthook
trustPolicyExclude: # []
  # Published by hand after its release workflow failed. Same code as v2.2.1
  - lefthook@2.2.2
# @endif

audit:
  ignore: # []
    # `picomatch` from dev tools has no patched version yet
    - GHSA-fc5q-39xc-vjpf
  ignorePrune: true

allowBuilds:
  # @if lefthook
  lefthook@2.2.2: true

  # @endif
  esbuild: false
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false
# @if ci
peerDependencyRules:
  allowedVersions:
    eslint-config-un@1.0.0-rc.7>eslint-plugin-github-action: '>=0.5.0 && < 1'
# @endif
