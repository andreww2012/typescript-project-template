# cspell:ignore Wayback
#:schema https://www.schemastore.org/lychee.json
#
# Repo-specific overrides layered on top of `lychee-config-nick2bad4u`, which is
# always passed first (see `check-links.yml`).
# Scalars here win over the baseline, list values are merged into it.

# Report broken links only. The baseline's "info" also streams a line per working
# link, and "warn" still streams excluded ones. Note that this leaves a local run
# printing nothing at all: the results go to the baseline's `output` file, and
# lychee never announces where that is. In CI the action supplies its own
# `--output` and echoes the report to the job log.
# verbose = "error"

# Reject redirects instead of following them: with a limit of 0 lychee returns
# the 3xx itself, which is not in `accept`, so a moved link fails loudly instead
# of silently passing as its redirect target.
max_redirects = 0

# Wayback snapshots are not a useful answer to a rejected redirect: the archived
# copy is suggested instead of the URL the link actually moved to.
suggest = false
remap = [
  '^https://npmx\.dev/((?:[\w.-]+|@[\w.-]+/[\w.-]+)(?:\?[^/]*)?)$ https://npmx.dev/package/$1',
  # GitHub throttles logged-out `blob` page views with 503s, hitting CI runners hardest. The raw
  # file still has Markdown heading fragments to verify; line anchors (`#L42`) are dropped
  '^https://github\.com/([\w.-]+/[\w.-]+)/blob/([^?#]+)(?:\?[^#]*)?(?:#L\d+(?:-L\d+)?)?(#.*)?$ https://raw.githubusercontent.com/$1/$2$3',
  # New GitHub repo issue page redirects crawlers (non-auth users)
  '^(https://github\.com/[^/#]+/[^/#]+)/issues/new(?:\?.*)?$ $1/issues',

  # Drop anchors lychee cannot verify because they are inserted by JS after load;
  # the fragment-less page is valid
  '^(https://github\.com/[\w.-]+/[\w.-]+/(?:issues|pull)/\d+)#issuecomment-\d+$ $1',
  '^(https://npmx\.dev/package-code/(?:@[\w.-]+/)?[\w.-]+/v/[\w.-]+/[\w./-]+)#L\d+$ $1',
]
exclude = [
  # @if contributors
  # Inserted by `all-contributors-cli` in README.md
  'README\.md#(example|ideas|infra|maintenance|tool)-[\w-]+$',
  '^https://all-contributors\.js\.org/docs/en/bot/usage$',

  # @endif
  # JS interpolations
  '^https?://.*\$%7[Bb]',
]
exclude_path = [
  # This file: lychee mistakes the regexes above for URLs to check
  '(^|[/\\])lychee\.toml$',
  # @if changesets
  # Generated by changesets
  '(^|[/\\])CHANGELOG\.md$',
  # @endif
  # Diffs of third-party packages, whose links are not ours to fix
  '(^|[/\\])patches[/\\]',
]
