pre-push:
  parallel: true
  commands:
    eslint:
      run: pnpm exec eslint --config eslint.config.ts --no-warn-ignored {push_files}
    oxfmt:
      run: pnpm exec oxfmt --check --no-error-on-unmatched-pattern {push_files}
    cspell:
      run: pnpm exec cspell --exclude '**/.*' --no-must-find-files {push_files}
    knip:
      run: nr knip
    types:
      run: nr ts

pre-commit:
  parallel: true
  skip: [merge, rebase]
  commands:
    oxfmt:
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {0}
