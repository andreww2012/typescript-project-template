saveExact: true
autoDedupe: true
saveTypes: true

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude: # []
  - '@types/node@22.20.5'
  - bingo@0.13.1

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: []

audit:
  ignore: # []
    - GHSA-ch52-4w7c-c8xp # `http-cache-semantics` from `eslint-config-un` has no patched version yet
  ignorePrune: true

allowBuilds:
  lefthook@2.1.16: true

  esbuild: false
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false
