# The root is listed too, so that changesets releases it with the other packages
packages:
  - ./
  - packages/*

saveExact: true
autoDedupe: true
saveTypes: true

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude: # []
  - '@andreww2012/ai-guidelines@0.2.1'
  - '@andreww2012/unutils@0.2.0'

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: []

audit:
  ignore: # []
    - GHSA-ch52-4w7c-c8xp # `http-cache-semantics` from `eslint-config-un` has no patched version yet
  ignorePrune: true

allowBuilds:
  lefthook@2.1.16: true

  esbuild: false
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false
