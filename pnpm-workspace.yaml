packages:
  - ./ # The root is listed too, so that changesets releases it with the other packages
  - packages/*
disallowWorkspaceCycles: true

catalogPrune: true
catalogs:
  default:
    '@andreww2012/ai-guidelines': ^0.2.11
    '@clack/prompts': 1.9.0
    '@commitlint/types': 21.2.3
    bingo: 0.16.2
    conventional-changelog-conventionalcommits: 10.4.1
    gitignore-reader-x: 0.1.0
    utilery: 0.4.0
    verkit: 0.5.0
    yaml: 2.9.1
    zod: 4.6.7
  dev:
    '@antfu/ni': 30.6.0
    '@arethetypeswrong/core': 0.18.5
    '@changesets/changelog-github': 1.0.1
    '@changesets/cli': 3.0.3
    '@commitlint/cli': 21.2.4
    '@commitlint/config-conventional': 21.2.4
    '@commitlint/lint': 21.2.4
    '@commitlint/load': 21.2.4
    '@eslint/config-inspector': 3.5.0
    '@types/node': 24.19.2
    '@vitest/coverage-v8': 5.1.1
    '@vitest/eslint-plugin': 1.6.28
    '@vitest/ui': 5.1.1
    actions-up: 2.0.0
    cspell: 10.5.2
    cspell-lib: 10.5.2
    eslint: 10.15.0
    eslint-config-un: 1.0.0-rc.7
    eslint-plugin-github-action: 0.5.0
    eslint-plugin-sentences-per-line: 0.1.6
    eslint-plugin-sonarjs: 4.2.2
    eslint-plugin-zod: 5.3.0
    knip: 6.45.1
    lefthook: 2.2.2
    npm-check-updates: 23.1.1
    oxfmt: 0.79.0
    publint: 0.3.25
    tsdown: 0.23.7
    tsx: 4.23.15
    typescript: npm:@typescript/typescript6@6.0.2
    typescript7: npm:typescript@7.0.2
    vitest: 5.1.1

saveExact: true
autoDedupe: true
saveTypes: true
lockfile:
  # Records `autoDedupe`, so that installs don't resolve the lockfile again
  includeResolutionSettings: true

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude: # []
  - '@andreww2012/ai-guidelines@0.2.11'
  - bingo@0.16.2
  - '@cspell/cspell-bundled-dicts@10.5.2'
  - '@cspell/cspell-json-reporter@10.5.2'
  - '@cspell/cspell-performance-monitor@10.5.2'
  - '@cspell/cspell-pipe@10.5.2'
  - '@cspell/cspell-resolver@10.5.2'
  - '@cspell/cspell-service-bus@10.5.2'
  - '@cspell/cspell-types@10.5.2'
  - '@cspell/cspell-worker@10.5.2'
  - '@cspell/dynamic-import@10.5.2'
  - '@cspell/filetypes@10.5.2'
  - '@cspell/rpc@10.5.2'
  - '@cspell/strong-weak-map@10.5.2'
  - '@cspell/url@10.5.2'
  - '@vitest/coverage-v8@5.1.1'
  - '@vitest/mocker@5.1.1'
  - '@vitest/pretty-format@5.1.1'
  - '@vitest/spy@5.1.1'
  - '@vitest/ui@5.1.1'
  - '@vitest/utils@5.1.1'
  - cspell-config-lib@10.5.2
  - cspell-dictionary@10.5.2
  - cspell-gitignore@10.5.2
  - cspell-glob@10.5.2
  - cspell-grammar@10.5.2
  - cspell-io@10.5.2
  - cspell-lib@10.5.2
  - cspell-trie-lib@10.5.2
  - cspell@10.5.2
  - vitest@5.1.1

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExcludePrune: true
trustPolicyExclude: # []
  # Published by hand after its release workflow failed. Same code as v2.2.1
  - lefthook@2.2.2

audit:
  ignore: # []
    # `picomatch` from dev tools has no patched version yet
    - GHSA-fc5q-39xc-vjpf
  ignorePrune: true

allowBuilds:
  lefthook@2.2.2: true

  esbuild: false
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false
peerDependencyRules:
  allowedVersions:
    eslint-config-un@1.0.0-rc.7>eslint-plugin-github-action: '>=0.5.0 <1'
